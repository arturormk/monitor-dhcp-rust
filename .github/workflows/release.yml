name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install the Rust target and static linker
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Verify the release tag
        run: |
          expected="$(cargo run --locked --quiet -- --version | awk '{print $2}')"
          test "$GITHUB_REF_NAME" = "$expected" || {
            echo "Tag $GITHUB_REF_NAME does not match binary version $expected" >&2
            exit 1
          }
      - name: Build static executable
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Detect a stable v1 release
        id: stable
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v1\.([0-9]+)$ ]] &&
             (( 10#${BASH_REMATCH[1]} % 2 == 0 )); then
            echo "build_packages=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_packages=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Package release
        run: |
          package="monitor-dhcp-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl"
          mkdir -p "release-staging/$package" dist
          cp target/x86_64-unknown-linux-musl/release/monitor-dhcp "release-staging/$package/"
          cp config.example.toml README.md LICENSE "release-staging/$package/"
          cp packaging/monitor-dhcp.service packaging/monitor-dhcp@.service \
            packaging/monitor-dhcp.8 "release-staging/$package/"
          cp docs/HOWTO-systemd.md "release-staging/$package/"
          tar -C release-staging -czf "dist/$package.tar.gz" "$package"
          cd dist
          sha256sum "$package.tar.gz" > "$package.tar.gz.sha256"
      - name: Install RPM packaging tools
        if: steps.stable.outputs.build_packages == 'true'
        run: sudo apt-get install --yes rpm
      - name: Build Debian and RPM packages
        if: steps.stable.outputs.build_packages == 'true'
        run: ./packaging/build-packages.sh all
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
