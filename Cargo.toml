[package]
name = "monitor-dhcp"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "A minimal deterministic DHCPv4 server for a dedicated Ethernet interface"
readme = "README.md"
repository = "https://github.com/arturormk/monitor-dhcp-rust"
keywords = ["dhcp", "networking", "linux", "server"]
categories = ["network-programming"]
publish = false

[dependencies]
dhcproto = { path = "vendor/dhcproto" }
env_logger = "0.11.11"
libc = "0.2.189"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
signal-hook = "0.4.5"
socket2 = { version = "0.5.10", features = ["all"] }
toml = "1.1.6"

[profile.release]
strip = true
lto = "thin"
